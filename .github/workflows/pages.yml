name: Publish Seminario 2027 to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts and 2027 curriculum
        run: |
          node --check learning/auth.js
          node --check learning/hub-v2.js
          node --check learning/theory-v2.js
          node --check learning/workshop-v2.js
          node --check learning/programming-topics-2027.js
          node --check learning/programming-workshops-2027.js
          node --check learning/programming-visuals-2027.js
          node --check learning/flowchart-execution-studio-v1.js
          node --check learning/track-navigation-2027.js
          node --check learning/python-worker.js
          node --check learning/python-runner.js
          node --check learning/sandbox-v39.js
          node --check learning/sandbox-workspace-v40.js
          node --check learning/operations-visual-v9.js
          node --check learning/arrays-consolidated-v34.js
          node --check learning/libraries-pandas-theory-v60.js
          node --check projects/cad-curriculum.js
          node --check projects/cad-lessons.js
          node --check projects/data.js
          node --check projects/projects.js
          node --check projects/game-lab.js
          node --check projects/game-curriculum.js
          node --check projects/game-visual-lab.js
          node scripts/qa-game-visual-lab.mjs
          node scripts/qa-godot-academy.mjs
          node scripts/qa-game-guide.mjs
          node scripts/qa.mjs
          node scripts/qa-learning-functional.mjs
          node scripts/qa-programming-data.mjs
          node scripts/qa-codequest.mjs
          node scripts/qa-codequest-skills.mjs
          node scripts/qa-codequest-island.mjs
          node scripts/qa-codequest-villages.mjs
          node scripts/qa-codequest-adventure.mjs
          node scripts/qa-codequest-airgear.mjs
      - name: Probe original ManimCE MP4 URLs (external availability)
        continue-on-error: true
        run: node scripts/qa-video-urls.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for the Pages artifact to be indexed
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT" --jq '.total_count' | grep -qx 1; then
              exit 0
            fi
            sleep 5
          done
          echo "The Pages artifact was not indexed after 60 seconds." >&2
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Verify live CodeQuest room assets against deployed commit
        run: |
          set -eu
          root="https://ijr-jd.github.io/Seminario-2027/projects/codequest-rpg"
          for file in index.html world.css world.js overworld.mjs island-adventure.mjs island-avatar.mjs island-airgear.mjs island-detail.mjs; do
            verified=false
            for attempt in {1..12}; do
              if curl -fsSL --max-time 20 "$root/$file?release=$GITHUB_SHA-$attempt" -o "/tmp/codequest-live-$file" && cmp -s "projects/codequest-rpg/$file" "/tmp/codequest-live-$file"; then
                echo "PASS live $file matches $GITHUB_SHA"
                verified=true
                break
              fi
              sleep 5
            done
            test "$verified" = true
          done
